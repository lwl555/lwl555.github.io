        var cats = [["all","全部"],["fav","⭐收藏"],["image","🖼️ 图片"],["text","📝 文本"],["dev","💻 开发"],["calc","🧮 计算"],["generator","✨ 生成"],["design","🎨 设计"],["life","⏰ 生活"],["office","📁 办公"],["learn","📚 学习"],["fun","🎮 趣味"]];
        var curCat = 'all';
        var favs = {};
        try { favs = JSON.parse(localStorage.getItem('toolbox_favs') || '{}'); } catch(e) {}
        function saveFavs() { try { localStorage.setItem('toolbox_favs', JSON.stringify(favs)); } catch(e) {} }
        var catsEl = document.getElementById('cats');
        cats.forEach(function(c) {
            var el = document.createElement('div');
            el.className = 'cat' + (c[0] === 'all' ? ' on' : '');
            el.textContent = c[1];
            el.onclick = function() {
                curCat = c[0];
                document.querySelectorAll('.cat').forEach(function(x){x.classList.remove('on')});
                el.classList.add('on');
                render();
            };
            catsEl.appendChild(el);
        });
        function render() {
            var q = document.getElementById('q').value.trim().toLowerCase();
            var grid = document.getElementById('grid');
            grid.innerHTML = '';
            var list = tools.filter(function(t) {
                if (curCat === 'fav' && !favs[t.id]) return false;
                if (curCat !== 'all' && curCat !== 'fav' && t.category !== curCat) return false;
                if (q && (t.title + t.desc + t.tags.join(' ')).toLowerCase().indexOf(q) < 0) return false;
                return true;
            });
            document.getElementById('count').textContent = list.length + ' 个工具' + (q ? ' · 搜索"' + document.getElementById('q').value + '"' : '');
            if (!list.length) {
                grid.innerHTML = '<div class="empty">没有找到相关工具 🤔</div>';
                return;
            }
            list.forEach(function(t) {
                var a = document.createElement('a');
                a.className = 'tool';
                a.href = t.url;
                a.innerHTML = '<div class="ico">' + t.icon + '</div><div class="tt">' + t.title + '</div><div class="dd">' + t.desc + '</div>';
                var s = document.createElement('div');
                s.className = 'star' + (favs[t.id] ? ' on' : '');
                s.textContent = favs[t.id] ? '★' : '☆';
                s.onclick = function(e) {
                    e.preventDefault(); e.stopPropagation();
                    favs[t.id] = !favs[t.id];
                    if (!favs[t.id]) delete favs[t.id];
                    saveFavs();
                    s.className = 'star' + (favs[t.id] ? ' on' : '');
                    s.textContent = favs[t.id] ? '★' : '☆';
                    if (curCat === 'fav') render();
                };
                a.appendChild(s);
                grid.appendChild(a);
            });
        }
        document.getElementById('q').addEventListener('input', render);
