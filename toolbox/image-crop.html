<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>图片裁剪 - 超有用的工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; padding: 26px 20px 22px; text-align: center; position: relative; }
        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .back-btn { position: absolute; left: 14px; top: 28px; color: white; text-decoration: none; font-size: 14px; background: rgba(255,255,255,.15); padding: 6px 12px; border-radius: 999px; }
        .container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); margin-bottom: 16px; }
        .card h2 { font-size: 16px; color: #1e293b; margin-bottom: 12px; }
        .textarea { width: 100%; min-height: 140px; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; line-height: 1.6; resize: vertical; outline: none; font-family: inherit; }
        .textarea:focus { border-color: #6366f1; }
        .input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; font-family: inherit; }
        .input:focus { border-color: #6366f1; }
        .btn-group { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; min-width: 80px; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-secondary { background: #f1f5f9; color: #1e293b; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-danger { background: #fee2e2; color: #991b1b; }
        .btn:active { transform: scale(.97); }
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 32px 16px; text-align: center; cursor: pointer; transition: all .3s; color: #64748b; font-size: 14px; }
        .upload-area:hover { border-color: #6366f1; background: #eef2ff; }
        .upload-area.has { border-style: solid; border-color: #6366f1; color: #4f46e5; padding: 14px; }
        .upload-area input { display: none; }
        canvas.tool-canvas { border: 2px solid #e2e8f0; border-radius: 12px; display: block; margin: 12px auto 0; max-width: 100%; touch-action: none; }
        .control-group { margin: 14px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .control-group label { min-width: 64px; font-size: 14px; color: #64748b; }
        .control-group input[type="range"] { flex: 1; min-width: 120px; accent-color: #6366f1; }
        .control-group select, .control-group input[type="text"], .control-group input[type="number"], .control-group input[type="date"], .control-group input[type="time"], .control-group input[type="datetime-local"], .control-group input[type="color"] { flex: 1; min-width: 120px; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; font-size: 14px; font-family: inherit; background: white; }
        .control-group input[type="color"] { padding: 4px; width: 56px; min-width: 56px; flex: none; height: 40px; cursor: pointer; }
        .control-group .val { font-size: 13px; color: #4f46e5; font-weight: 600; min-width: 44px; text-align: right; }
        .result { background: #f1f5f9; border-radius: 12px; padding: 16px; margin-top: 14px; min-height: 48px; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; display: none; line-height: 1.6; }
        .result.show { display: block; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-top: 14px; }
        .stat { background: #eef2ff; border-radius: 12px; padding: 12px 8px; text-align: center; }
        .stat .num { font-size: 20px; font-weight: 700; color: #4f46e5; }
        .stat .label { font-size: 12px; color: #64748b; margin-top: 4px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-top: 8px; font-size: 14px; gap: 8px; }
        .file-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; }
        .file-item .meta { color: #94a3b8; font-size: 12px; white-space: nowrap; }
        .file-item .del { color: #ef4444; cursor: pointer; font-size: 16px; padding: 0 4px; }
        .file-item .mv { color: #64748b; cursor: pointer; padding: 0 4px; user-select: none; font-size: 16px; }
        table.tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
        .tbl th { color: #64748b; font-weight: 600; background: #f8fafc; }
        .tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        .tbl th:first-child, .tbl td:first-child { text-align: left; }
        .tbl tr:last-child td { border-bottom: none; }
        .tbl .hl td { color: #4f46e5; font-weight: 700; }
        .swatch { height: 60px; border-radius: 12px; margin-top: 8px; cursor: pointer; display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px; color: white; font-size: 12px; font-family: ui-monospace, monospace; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .chip { padding: 8px 14px; border-radius: 999px; background: #f1f5f9; color: #475569; font-size: 13px; cursor: pointer; border: 1.5px solid transparent; user-select: none; }
        .chip.on { background: #eef2ff; color: #4f46e5; border-color: #6366f1; font-weight: 600; }
        .preview-box { border: 2px solid #e2e8f0; border-radius: 12px; margin-top: 14px; padding: 20px; text-align: center; background: repeating-conic-gradient(#f1f5f9 0% 25%, #fff 0% 50%) 50% / 20px 20px; overflow: auto; }
        .tips { background: #eef2ff; border-radius: 12px; padding: 16px; margin-top: 4px; }
        .tips h3 { font-size: 14px; color: #4f46e5; margin-bottom: 8px; }
        .tips ul { list-style: none; font-size: 13px; color: #6366f1; line-height: 1.8; text-align: left; }
        .tips ul li::before { content: "💡 "; }
        .footer { text-align: center; padding: 20px; color: #94a3b8; font-size: 12px; }
        .toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 22px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99; white-space: nowrap; }
        .toast.show { opacity: 1; }
        .seg { display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; margin: 12px 0; }
        .seg button { flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 8px; font-size: 13px; color: #64748b; cursor: pointer; font-weight: 600; font-family: inherit; }
        .seg button.on { background: white; color: #4f46e5; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .big-display { font-size: 44px; font-weight: 700; color: #4f46e5; text-align: center; font-family: ui-monospace, Menlo, Consolas, monospace; margin: 18px 0; letter-spacing: 1px; }
        .sub-display { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 8px; }
</style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">← 返回</a>
        <h1>🖼️ 图片裁剪</h1>
        <p>拖动选框自由裁剪，支持常用比例。</p>
    </div>
    <div class="container">
        <div class="card">
            <h2>1. 上传图片</h2>
            <div class="upload-area" id="dropZone"><input type="file" id="fileInput" accept="image/*"><p>📁 点击或拖拽上传图片</p></div>
        </div>
        <div class="card" id="step2" style="display:none">
            <h2>2. 拖动调整裁剪框</h2>
            <div class="chips" id="ratios"></div>
            <div style="position:relative;margin-top:12px;user-select:none">
                <canvas id="cv" class="tool-canvas" style="width:100%"></canvas>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="resetSel()">↺ 重置</button>
                <button class="btn btn-primary" onclick="doCrop()">✂️ 裁剪并下载</button>
            </div>
        </div>
        <div class="tips"><h3>使用提示</h3><ul><li>拖动矩形框选择要保留的区域</li><li>一寸/二寸证件照可用比例裁剪</li><li>纯本地处理，图片不上传</li></ul></div>
    </div>
    <div class="footer">超有用的林 · 每天一个超实用小工具</div>
    <div class="toast" id="toast"></div>

    <script>

        function $(id){return document.getElementById(id);}
        function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show')},1800);}
        function dl(name,blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);}
        function cdl(c,name,type,q){c.toBlob(function(b){if(b)dl(name,b);else toast('导出失败');},type||'image/png',q===undefined?0.92:q);}
        function loadImg(file,cb){var r=new FileReader();r.onload=function(e){var i=new Image();i.onload=function(){cb(i,e.target.result);};i.onerror=function(){toast('图片加载失败');};i.src=e.target.result;};r.readAsDataURL(file);}
        function fmtSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB';}
        function bindDrop(zone,input,handler){zone.addEventListener('click',function(){input.click();});input.addEventListener('change',function(){if(input.files&&input.files[0])handler(input.files);});['dragover','dragleave','drop'].forEach(function(ev){zone.addEventListener(ev,function(e){e.preventDefault();if(ev==='dragover')zone.style.background='#eef2ff';else zone.style.background='';if(ev==='drop'&&e.dataTransfer.files.length)handler(e.dataTransfer.files);});});}


        var img = null, sel = null, drag = null, ratio = 0, scale = 1;
        bindDrop($('dropZone'), $('fileInput'), function(files){
            loadImg(files[0], function(i){
                img = i;
                $('step2').style.display = 'block';
                var cv = $('cv');
                var maxW = 560;
                scale = Math.min(1, maxW / i.width);
                cv.width = Math.round(i.width * scale); cv.height = Math.round(i.height * scale);
                cv.style.width = '100%'; cv.style.height = 'auto';
                resetSel(); draw(); bindTouch();
            });
        });
        var rs = [['自由', 0], ['1:1', 1], ['4:3', 4/3], ['3:4', 3/4], ['16:9', 16/9], ['9:16', 9/16], ['一寸(295:413)', 295/413]];
        var rbox = $('ratios');
        rs.forEach(function(r, idx){
            var el = document.createElement('div');
            el.className = 'chip' + (idx === 0 ? ' on' : '');
            el.textContent = r[0];
            el.onclick = function(){ ratio = r[1]; rbox.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')}); el.classList.add('on'); resetSel(); draw(); };
            rbox.appendChild(el);
        });
        function resetSel() {
            var cv = $('cv');
            if (!img) return;
            var w = cv.width, h = cv.height, sw = w * 0.8, sh = h * 0.8;
            if (ratio) { if (sw / sh > ratio) sw = sh * ratio; else sh = sw / ratio; }
            sel = { x: (w - sw) / 2, y: (h - sh) / 2, w: sw, h: sh };
        }
        function draw() {
            if (!img) return;
            var cv = $('cv'), c = cv.getContext('2d');
            c.drawImage(img, 0, 0, cv.width, cv.height);
            c.fillStyle = 'rgba(15,23,42,.62)';
            c.fillRect(0, 0, cv.width, cv.height);
            c.save();
            c.beginPath(); c.rect(sel.x, sel.y, sel.w, sel.h); c.clip();
            c.drawImage(img, 0, 0, cv.width, cv.height);
            c.restore();
            c.strokeStyle = '#6366f1'; c.lineWidth = 2.5;
            c.strokeRect(sel.x, sel.y, sel.w, sel.h);
            c.fillStyle = '#6366f1';
            [[0,0],[1,0],[0,1],[1,1]].forEach(function(p){
                c.fillRect(sel.x + sel.w * p[0] - 6 + (p[0]?-2:2)*0, sel.y + sel.h * p[1] - 6, 12, 12);
            });
            c.font = '12px sans-serif'; c.fillStyle = '#fff';
            c.fillText(Math.round(sel.w / scale) + ' × ' + Math.round(sel.h / scale), sel.x + 4, sel.y + sel.h + 16 > cv.height ? sel.y + sel.h - 8 : sel.y + sel.h + 14);
        }
        function pos(e) {
            var r = $('cv').getBoundingClientRect();
            var t = e.touches ? e.touches[0] : e;
            return { x: (t.clientX - r.left) * $('cv').width / r.width, y: (t.clientY - r.top) * $('cv').height / r.height };
        }
        function cornerHit(p) {
            var corners = [[sel.x, sel.y, 'nw'], [sel.x + sel.w, sel.y, 'ne'], [sel.x, sel.y + sel.h, 'sw'], [sel.x + sel.w, sel.y + sel.h, 'se']];
            for (var i = 0; i < 4; i++) { if (Math.abs(p.x - corners[i][0]) < 24 && Math.abs(p.y - corners[i][1]) < 24) return corners[i][2]; }
            return null;
        }
        function bindTouch() {
            var cv = $('cv');
            function start(e) {
                if (!sel) return;
                var p = pos(e);
                var c = cornerHit(p);
                drag = c ? { mode: c, p: p } : (p.x > sel.x && p.x < sel.x + sel.w && p.y > sel.y && p.y < sel.y + sel.h) ? { mode: 'move', p: p } : null;
                if (drag) e.preventDefault();
            }
            function move(e) {
                if (!drag) return;
                e.preventDefault();
                var p = pos(e), dx = p.x - drag.p.x, dy = p.y - drag.p.y;
                if (drag.mode === 'move') { sel.x += dx; sel.y += dy; }
                else {
                    if (drag.mode.indexOf('w') >= 0) { sel.x += dx; sel.w -= dx; }
                    if (drag.mode.indexOf('e') >= 0) sel.w += dx;
                    if (drag.mode.indexOf('n') >= 0) { sel.y += dy; sel.h -= dy; }
                    if (drag.mode.indexOf('s') >= 0) sel.h += dy;
                }
                if (ratio && drag.mode !== 'move') { sel.h = sel.w / ratio; }
                sel.w = Math.max(20, sel.w); sel.h = Math.max(20, sel.h);
                sel.x = Math.max(0, Math.min(sel.x, cv.width - 20));
                sel.y = Math.max(0, Math.min(sel.y, cv.height - 20));
                if (sel.x + sel.w > cv.width) sel.w = cv.width - sel.x;
                if (sel.y + sel.h > cv.height) sel.h = cv.height - sel.y;
                drag.p = p;
                draw();
            }
            function end() { drag = null; }
            cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
            cv.addEventListener('touchstart', start, { passive: false });
            cv.addEventListener('touchmove', move, { passive: false });
            cv.addEventListener('touchend', end);
        }
        function doCrop() {
            if (!img || !sel) return;
            var out = document.createElement('canvas');
            out.width = Math.round(sel.w / scale); out.height = Math.round(sel.h / scale);
            out.getContext('2d').drawImage(img, sel.x / scale, sel.y / scale, sel.w / scale, sel.h / scale, 0, 0, out.width, out.height);
            out.toBlob(function(b){ dl('裁剪_' + out.width + 'x' + out.height + '.png', b); toast('已裁剪并下载'); }, 'image/png');
        }
    </script>
</body>
</html>
