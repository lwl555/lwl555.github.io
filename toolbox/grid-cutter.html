<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九宫格切图 - 超有用的林</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px 20px;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e8eeff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-hint {
            font-size: 14px;
            color: #999;
        }

        .file-input {
            display: none;
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 10px;
        }

        .preview-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
        }

        .preview-item:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .download-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .preview-item:hover .download-btn {
            opacity: 1;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #eee;
            border-color: #ccc;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .tips {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .tips h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }

        .tips ul {
            list-style: none;
            font-size: 14px;
            color: #666;
            line-height: 1.8;
        }

        .tips ul li::before {
            content: '💡 ';
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #eee;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
        }

        .modal-image {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .content {
                padding: 20px 15px;
            }

            .upload-area {
                padding: 30px 15px;
            }

            .upload-icon {
                font-size: 50px;
            }

            .upload-text {
                font-size: 16px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>九宫格切图</h1>
            <p>一键将图片切成九宫格，发朋友圈超好看！</p>
        </div>

        <div class="content">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📷</div>
                <div class="upload-text">点击或拖拽图片到这里</div>
                <div class="upload-hint">支持 JPG、PNG、GIF 格式，建议正方形图片效果最佳</div>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在处理图片...</p>
            </div>

            <div class="preview-section" id="previewSection">
                <div class="preview-title">预览效果</div>
                <div class="preview-grid" id="previewGrid"></div>
                <div class="button-group">
                    <button class="btn btn-primary" id="downloadAllBtn" disabled>
                        📥 下载全部
                    </button>
                    <button class="btn btn-secondary" id="resetBtn">
                        🔄 重新选择
                    </button>
                </div>
            </div>

            <div class="tips">
                <h3>使用技巧</h3>
                <ul>
                    <li>选择正方形图片效果最佳，系统会自动裁剪</li>
                    <li>点击单张图片可预览大图</li>
                    <li>长按图片可保存到相册</li>
                    <li>下载后按顺序1-9发布到朋友圈即可</li>
                </ul>
            </div>
        </div>

        <div class="footer">
            <p>超有用的林 · 每天一个超实用小工具</p>
        </div>
    </div>

    <!-- 预览模态框 -->
    <div class="modal" id="previewModal">
        <button class="modal-close" id="modalClose">✕</button>
        <div class="modal-content">
            <img class="modal-image" id="modalImage" src="" alt="预览图片">
        </div>
    </div>

    <script>
        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const previewSection = document.getElementById('previewSection');
        const previewGrid = document.getElementById('previewGrid');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const resetBtn = document.getElementById('resetBtn');
        const previewModal = document.getElementById('previewModal');
        const modalImage = document.getElementById('modalImage');
        const modalClose = document.getElementById('modalClose');

        // 存储切割后的图片数据
        let slicedImages = [];

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择变化
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        // 处理文件
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件！');
                return;
            }

            // 显示加载状态
            uploadArea.style.display = 'none';
            loading.classList.add('active');

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    sliceImage(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 切割图片
        function sliceImage(img) {
            slicedImages = [];
            previewGrid.innerHTML = '';

            // 计算切割尺寸（取最小边作为基准）
            const size = Math.min(img.width, img.height);
            const pieceSize = Math.floor(size / 3);

            // 计算居中裁剪的起始位置
            const startX = Math.floor((img.width - size) / 2);
            const startY = Math.floor((img.height - size) / 2);

            // 创建Canvas进行切割
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = pieceSize;
                    canvas.height = pieceSize;
                    const ctx = canvas.getContext('2d');

                    // 绘制图片片段
                    ctx.drawImage(
                        img,
                        startX + col * pieceSize,
                        startY + row * pieceSize,
                        pieceSize,
                        pieceSize,
                        0,
                        0,
                        pieceSize,
                        pieceSize
                    );

                    // 转换为DataURL（高质量PNG）
                    const dataUrl = canvas.toDataURL('image/png');
                    slicedImages.push(dataUrl);

                    // 创建预览项
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    previewItem.innerHTML = `
                        <img src="${dataUrl}" alt="第${row * 3 + col + 1}张">
                        <button class="download-btn" onclick="downloadSingle(${row * 3 + col})">下载</button>
                    `;
                    previewItem.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('download-btn')) {
                            showModal(dataUrl);
                        }
                    });
                    previewGrid.appendChild(previewItem);
                }
            }

            // 隐藏加载，显示预览
            loading.classList.remove('active');
            previewSection.style.display = 'block';
            downloadAllBtn.disabled = false;
        }

        // 下载单张图片
        function downloadSingle(index) {
            const link = document.createElement('a');
            link.download = `九宫格_${index + 1}.png`;
            link.href = slicedImages[index];
            link.click();
        }

        // 下载全部图片
        downloadAllBtn.addEventListener('click', () => {
            slicedImages.forEach((dataUrl, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.download = `九宫格_${index + 1}.png`;
                    link.href = dataUrl;
                    link.click();
                }, index * 100); // 延迟下载，避免浏览器阻止
            });
        });

        // 重新选择
        resetBtn.addEventListener('click', () => {
            slicedImages = [];
            previewGrid.innerHTML = '';
            previewSection.style.display = 'none';
            uploadArea.style.display = 'block';
            fileInput.value = '';
            downloadAllBtn.disabled = true;
        });

        // 显示模态框预览
        function showModal(dataUrl) {
            modalImage.src = dataUrl;
            previewModal.classList.add('active');
        }

        // 关闭模态框
        modalClose.addEventListener('click', () => {
            previewModal.classList.remove('active');
        });

        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) {
                previewModal.classList.remove('active');
            }
        });

        // 触摸反馈
        uploadArea.addEventListener('touchstart', () => {
            uploadArea.style.transform = 'scale(0.98)';
        });

        uploadArea.addEventListener('touchend', () => {
            uploadArea.style.transform = 'scale(1)';
        });
    </script>
</body>
</html>
