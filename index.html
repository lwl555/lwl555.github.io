<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>择校通 · 高校与职业决策工具</title>
  <!-- 自动跳转到项目 Pages。2 秒后再跳，给视觉提示一个缓冲 -->
  <meta http-equiv="refresh" content="2;url=https://lwl555.github.io/zexiaotong/" />
  <link rel="canonical" href="https://lwl555.github.io/zexiaotong/" />
  <style>
    :root { --ink: #1f1a14; --muted: #6b6356; --accent: #c2410c; --bg: #f6f2ea; --surface: #fffdf9; --border: #e7e0d4; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", Georgia, serif;
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
    }
    .card {
      max-width: 480px; width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px 30px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(33, 31, 27, 0.06);
    }
    .eyebrow {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 11.5px; letter-spacing: 0.18em;
      color: var(--muted); text-transform: uppercase;
    }
    h1 {
      font-size: 30px; font-weight: 700; margin: 14px 0 8px;
      letter-spacing: 0.01em;
    }
    p {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--muted); font-size: 14.5px; line-height: 1.7;
      margin: 0 0 22px;
    }
    .cta {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px; font-weight: 600; color: #fff;
      background: var(--accent);
      padding: 12px 26px;
      border-radius: 9px;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .cta:hover { background: #a8360a; }
    .meta {
      margin-top: 22px;
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 11.5px; color: var(--muted);
    }
    .meta code {
      background: #f0ead9; padding: 2px 6px; border-radius: 4px;
      color: var(--ink);
    }
    .countdown {
      display: inline-block; min-width: 18px;
      color: var(--accent); font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">redirect</div>
    <h1>择校通</h1>
    <p>
      站点已迁移到子路径，<br />
      将在 <span class="countdown" id="cd">2</span> 秒后自动跳转。
    </p>
    <a class="cta" href="https://lwl555.github.io/zexiaotong/" rel="noopener">
      立即进入 →
    </a>
    <div class="meta">
      或手动打开：<code>lwl555.github.io/zexiaotong</code>
    </div>
  </main>
  <script>
    // 倒计时提示（meta refresh 兜底，这里只是好看）
    let n = 2;
    const el = document.getElementById('cd');
    const t = setInterval(() => {
      n -= 1;
      if (el) el.textContent = String(Math.max(n, 0));
      if (n <= 0) clearInterval(t);
    }, 1000);
  </script>
</body>
</html>
