<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>暖记</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="tb-row">
    <div class="tb-left">
      <div class="tb-title" id="pageTitle">首页</div>
      <div class="tb-sub" id="netBar">离线也能记 · 联网自动备份</div>
    </div>
    <button class="tb-action" id="syncBtn">同步</button>
  </div>
</header>

<main class="view" id="view"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab is-active" data-page="home">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-6v-6h-4v6H4z"/></svg><span>首页</span>
  </button>
  <button class="tab" data-page="records">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>账单</span>
  </button>
  <button class="tab" data-page="calc">
    <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 12h.01M15 12h.01M9 17h.01M15 17h.01"/></svg><span>计算器</span>
  </button>
  <button class="tab" data-page="ai">
    <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/></svg><span>AI</span>
  </button>
  <button class="tab" data-page="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg><span>设置</span>
  </button>
</nav>

<div class="sheet hidden" id="sheet">
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <span id="sheetTitle">标题</span>
      <button class="sheet-close" id="sheetClose">关闭</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="chat-overlay hidden" id="chatOverlay">
  <div class="chat-head">
    <div class="chat-title">小账 · AI 聊天助手</div>
    <button class="chat-close" data-act="closeChat">关闭</button>
  </div>
  <div class="chat-box" id="chatBox"></div>
  <div class="chat-input-row">
    <button class="chat-img-btn" data-act="chatImg" title="发送图片">🖼️</button>
    <input class="chat-input" id="chatInput" placeholder="问小账点什么…（可发图）" />
    <button class="chat-send" data-act="sendChat">发送</button>
  </div>
</div>

<div class="img-overlay hidden" id="imgOverlay">
  <img src="" alt="">
  <button class="img-close" data-act="closeImg">关闭</button>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
